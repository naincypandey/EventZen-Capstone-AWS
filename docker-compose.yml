services:
  mysql-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${DB_NAME:-eventzen_auth}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/${DB_NAME:-eventzen_auth}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      mysql-db:
        condition: service_healthy

  venue-service:
    build: ./venue-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=mysql-db;Database=${DB_NAME:-eventzen_auth};Uid=root;Pwd=${DB_PASSWORD:-password};
    depends_on:
      mysql-db:
        condition: service_healthy

  attendee-service:
    build: ./attendee-service

  frontend:
    build:
      context: ./frontend-react
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - attendee-service
      - venue-service