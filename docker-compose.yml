auth-service:
  build: ./auth-service
  environment:
    - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/eventzen_auth?createDatabaseIfNotExist=true
    - SPRING_DATASOURCE_USERNAME=root
    - SPRING_DATASOURCE_PASSWORD=password
    - SPRING_JPA_HIBERNATE_DDL_AUTO=update
  depends_on:
    mysql-db:
      condition: service_healthy