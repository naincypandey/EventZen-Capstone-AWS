services:
  mysql-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=eventzen_auth
      - MYSQL_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/eventzen_auth
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      mysql-db:
        condition: service_healthy

  venue-service:
    build: ./venue-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      mysql-db:
        condition: service_healthy

  attendee-service:
    build: ./attendee-service

  frontend:
    build:
      context: ./frontend-react
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - attendee-service
      - venue-service