version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=eventzen_auth
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}

  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/eventzen_auth
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy

  venue-service:
    build: ./venue-service
    ports:
      - "5059:5059"

  attendee-service:
    build: ./attendee-service
    ports:
      - "5001:5001"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend-react
      args:
        - VITE_AUTH_API_URL=http://3.85.132.68:8080
        - VITE_VENUE_API_URL=http://3.85.132.68:5059
        - VITE_ATTENDEE_API_URL=http://3.85.132.68:5001
    ports:
      - "5173:80"