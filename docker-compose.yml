services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=eventzen_auth
      - MYSQL_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Added MongoDB to fix the attendee-service crash
  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/eventzen_auth
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      mysql-db:
        condition: service_healthy

  venue-service:
    build: ./venue-service
    container_name: venue-service
    ports:
      - "5059:5059"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5059
    depends_on:
      mysql-db:
        condition: service_healthy

  attendee-service:
    build: ./attendee-service
    container_name: attendee-service
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongo-db:27017/attendee_db #  Fixed the "undefined" error
    depends_on:
      - mongo-db

  frontend:
    build:
      context: ./frontend-react
    container_name: frontend-react
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - attendee-service
      - venue-service