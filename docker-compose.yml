frontend:
    build:
      context: ./frontend-react
      args:
        - VITE_AUTH_API_URL=/api/auth
        - VITE_VENUE_API_URL=/api/venue
        - VITE_ATTENDEE_API_URL=/api/attendee
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - attendee-service
      - venue-service