server {
    listen 80;

    # Serve the React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Forward /api/auth to Java Service
    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        proxy_set_header Host $host;
    }

    # Forward /api/venue to .NET Service
    location /api/venue/ {
        proxy_pass http://venue-service:5059/;
        proxy_set_header Host $host;
    }

    # Forward /api/bookings to Node Service
    location /api/bookings/ {
        proxy_pass http://attendee-service:5001/;
        proxy_set_header Host $host;
    }
}