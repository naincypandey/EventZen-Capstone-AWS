server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy calls to Java Auth Service
    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy calls to .NET Venue Service
    location /api/venue/ {
        proxy_pass http://venue-service:5059/;
        proxy_set_header Host $host;
    }

    # Proxy calls to Node Attendee Service
    location /api/attendee/ {
        proxy_pass http://attendee-service:5001/;
        proxy_set_header Host $host;
    }
}