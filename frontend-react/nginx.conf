server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Auth Service
    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        proxy_set_header Host $host;
    }

    # Proxy Venue Service
    location /api/venue/ {
        proxy_pass http://venue-service:5059/;
        proxy_set_header Host $host;
    }

    # Proxy Attendee/Booking Service
    location /api/attendee/ {
        proxy_pass http://attendee-service:5001/;
        proxy_set_header Host $host;
    }
}