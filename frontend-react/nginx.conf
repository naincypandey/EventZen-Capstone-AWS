server {
    listen 80;
    
    # Static Frontend Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Forward Auth requests to Java Service (Spring Boot)
    location /api/auth/ {
        proxy_pass http://auth-service:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward Venue requests to .NET Service (ASP.NET Core)
    location /api/venue/ {
        proxy_pass http://venue-service:5059/api/venue/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward Booking requests to Node Service (Express)
    location /api/booking/ {
        proxy_pass http://attendee-service:5001/api/bookings/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}