spring:
  application:
    name: auth-service

  datasource:
    # Adding default values after the ':' so it doesn't fail if ENV vars aren't set
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eventzen_auth}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  main:
    allow-circular-references: true

server:
  port: 8080

# SpringDoc Configuration for Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # This helps if you are using a reverse proxy like Nginx on AWS
    operations-sorter: alpha

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springdoc: DEBUG