spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eventzen_auth}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  # Adding this ensures Tomcat doesn't add extra folders to your URL
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # This matches the standard Spring Boot 3 path
    path: /swagger-ui.html
    enabled: true
  # This is critical for AWS/Docker
  show-actuator: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springdoc: DEBUG